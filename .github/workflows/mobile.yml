# Mobile quality gate + release.
#
#   push/PR to dev, main ........ verify (EXACTLY the members of `npm run verify`) + Metro export
#   push to main ................ automatic tag (latest MAJOR.MINOR + 1, starting at 0.1), then a
#                                 release: app version set to the tag, export bundle attached to a
#                                 GitHub release, store builds on EAS when EXPO_TOKEN is set
#
# Repository variable EXPO_PUBLIC_API_URL (https://.../api/v1) is required for the release.
name: mobile

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (npm run verify)
        run: npm run verify

      # Branch runs only prove the bundle compiles; a placeholder URL is fine here.
      - name: Metro export (both platforms bundle)
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.example.com/api/v1' }}
        run: npx expo export --platform all --output-dir dist

  tag:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version, increment minor, and set tag name
        id: version
        run: |
          latest_tag=$(git tag --list '[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            # No tag found, start at 0.1
            major=0
            minor=1
          else
            # Get the major and minor versions
            IFS='.' read -r major minor <<< "$latest_tag"
            # Increment minor
            minor=$((minor + 1))
          fi
          tag="$major.$minor"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next tag: $tag"

      - name: Push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable EXPO_PUBLIC_API_URL (https://.../api/v1) before releasing."
            exit 1
          fi

      - name: Stamp the app with the tag version
        run: node scripts/sync-version.mjs "$TAG"

      - name: Metro export (both platforms bundle)
        run: npx expo export --platform all --output-dir dist

      - name: Bundle the export
        run: tar -czf "a-fit-${TAG}-export.tgz" -C dist .

      - name: GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "a-fit-${TAG}-export.tgz" \
            --title "A-FIT $TAG" \
            --generate-notes

      - name: Store builds on EAS (only when EXPO_TOKEN is configured)
        if: env.EXPO_TOKEN != ''
        env:
          EAS_NO_VCS: "1" # include the stamped app.json, which is not committed
        run: npx eas-cli build --platform all --profile production --non-interactive --no-wait
